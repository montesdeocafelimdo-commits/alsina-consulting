<!-- PENDIENTE: reemplazar por el isotipo oficial (equipo de diseño).
     Favicon con variante automática para dark mode del navegador. -->
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ALSINA">
  <style>
    .frame{ stroke:#2196c9; }
    .letter{ fill:#14294d; }
    .cut{ fill:#4db8e0; }
    @media (prefers-color-scheme: dark){
      .letter{ fill:#F3EFE7; }
    }
  </style>
  <rect class="frame" x="3" y="3" width="58" height="58" rx="4" fill="none" stroke-width="2.5"/>
  <text class="letter" x="32" y="47" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700">A</text>
  <rect class="cut" x="13" y="28" width="38" height="6" transform="rotate(-28 32 31)"/>
</svg>
